name: specify
description: "Turn an ambition into a spec and tickets for the developer to check before any building starts."
parameters:
  - name: ambition
    description: What the developer wants
    required: true
steps:
  - id: specify
    guild: chancery
    task: "Write a spec and tickets, with declared blocking dependencies, for: {{ambition}}. The deliverable is the full text of the spec and every ticket with its blocked-by, handed back in full for the developer to review and accept or decline; not a summary."
    outputs: [spec, tickets]
    checkpoint: true
