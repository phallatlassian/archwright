name: fix
description: "Fix a defect in a Site: reproduce, correct and verify it, then review the fix and open the pull request. Use for a bug report or failing behaviour."
parameters:
  - name: problem
    description: The defect, with how to reproduce it
    required: true
steps:
  - id: fix
    guild: masonry
    task: "Diagnose and fix this defect, adding a failing test first: {{problem}}"
    outputs: [diff]
  - id: review
    guild: hallmark
    task: "Review the fix for this defect: {{problem}}"
    inputs: [fix.diff]
    blocked_by: [fix]
  - id: open-pr
    guild: masonry
    task: "Open the pull request for this fix: {{problem}}"
    inputs: [review.verdict]
    blocked_by: [review]
