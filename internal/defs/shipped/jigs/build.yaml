name: build
description: "Build a feature from a spec or ticket that is specific enough to implement, then review it and open the pull request."
parameters:
  - name: ticket
    description: The ticket or spec to build, with its constraints
    required: true
steps:
  - id: build
    guild: masonry
    task: "Implement: {{ticket}}"
    outputs: [diff]
  - id: review
    guild: hallmark
    task: "Review the implementation of: {{ticket}}"
    inputs: [build.diff]
    blocked_by: [build]
  - id: open-pr
    guild: masonry
    task: "Open the pull request for this implementation: {{ticket}}"
    inputs: [review.verdict]
    blocked_by: [review]
